<!DOCTYPE html>
 <html>
  <head>
   <title>Still Life Study</title>
    <link href="drawing.css" rel="stylesheet">
  </head>
   <body>

   <div class="scene">
    <div class="green-backdrop"></div>
    <div class="hanging-cloth"></div>
    <div class="white-cloth"></div>
    <div class="table-cloth"></div>

    <div class="mug">
      <div class="mug-handle"></div>
      <div class="mug-body"></div>
      <div class="mug-rim"></div>
    </div>

    <div class="pear">
      <div class="pear-stem"></div>
      <div class="pear-top"></div>
      <div class="pear-body"></div>
    </div>

    <div class="orange">
      <div class="orange-leaf"></div>
    </div>

    <div class="kettle">
      <div class="kettle-handle"></div>
      <div class="kettle-spout"></div>
      <div class="kettle-body"></div>
      <div class="kettle-lid"></div>
      <div class="kettle-knob"></div>
    </div>
   </div>

  </body>
 </html>
